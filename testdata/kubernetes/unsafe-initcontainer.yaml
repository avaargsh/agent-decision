apiVersion: apps/v1
kind: Deployment
metadata:
  name: unsafe-initcontainer
  namespace: production
spec:
  replicas: 1
  selector:
    matchLabels:
      app: unsafe-initcontainer
  template:
    metadata:
      labels:
        app: unsafe-initcontainer
    spec:
      securityContext:
        runAsNonRoot: true
      containers:
        - name: payment-api
          image: registry.example.com/payments/api@sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 512Mi
          securityContext:
            privileged: false
            runAsNonRoot: true
      initContainers:
        - name: bootstrap
          image: registry.example.com/bootstrap:latest
          securityContext:
            privileged: true
