name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: agent_decision
          POSTGRES_PASSWORD: agent_decision
          POSTGRES_DB: agent_decision_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U agent_decision -d agent_decision_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://agent_decision:agent_decision@localhost:5432/agent_decision_test?sslmode=disable
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Resolve and verify Go module graph
        run: |
          go mod tidy
          cat go.mod
          cat go.sum
      - name: Test
        run: go test -race ./...
      - name: Vet
        run: go vet ./...
