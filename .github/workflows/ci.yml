name: go-ci
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: agent_decision_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d agent_decision_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/agent_decision_test?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.3'
      - run: go mod download
      - run: go mod verify
      - run: go test -mod=readonly -race ./...
      - run: go test -mod=readonly -tags postgres -race ./...
      - run: go vet -mod=readonly ./...
      - run: go vet -mod=readonly -tags postgres ./...
      - run: test -z "$(gofmt -l $(find . -name '*.go'))"
